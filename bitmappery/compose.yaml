services:
  bitmappery:
    container_name: ${CONTAINER_NAME:-bitmappery}
    image: ${BITMAPPERY_IMAGE:-ghcr.io/formless63/bitmappery:latest}
    restart: unless-stopped
    # Production static site served by unprivileged nginx on container port 5173.
    ports:
      - "${APP_PORT:-5173}:5173"
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
