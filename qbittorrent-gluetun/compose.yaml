x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILES:-3}"

services:
  gluetun:
    image: ${GLUETUN_IMAGE:-qmcgaw/gluetun:latest}
    container_name: ${VPN_CONTAINER_NAME:-gluetun}
    cap_add: [NET_ADMIN]
    devices:
      - ${TUN_DEVICE:-/dev/net/tun}:/dev/net/tun
    volumes:
      - ${VPN_CONFIG_DIR:-./config/gluetun}:/gluetun
    ports:
      - "${QBIT_BIND_IP:-0.0.0.0}:${QBIT_PORT:-8080}:8080/tcp"
    environment:
      TZ: ${TZ:-Etc/UTC}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-protonvpn}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${PROTON_KEY:?Set PROTON_KEY in .env}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-United States}
      PORT_FORWARD_ONLY: "${PORT_FORWARD_ONLY:-on}"
      VPN_PORT_FORWARDING: "${VPN_PORT_FORWARDING:-on}"
      # Inbound management access does not require outbound LAN exceptions.
      FIREWALL_INPUT_PORTS: "8080,8000"
      FIREWALL_OUTBOUND_SUBNETS: ${FIREWALL_OUTBOUND_SUBNETS:-}
      HTTP_CONTROL_SERVER_ADDRESS: ":8000"
      HTTP_CONTROL_SERVER_LOG: "${CONTROL_SERVER_LOG:-on}"
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: >-
        {"auth":"basic","username":"${GLUETUN_USER:?Set GLUETUN_USER in .env}","password":"${GLUETUN_PASS:?Set GLUETUN_PASS in .env}"}
    networks: [media-vpn]
    restart: unless-stopped
    logging: *logging

  qbittorrent:
    image: ${QBIT_IMAGE:-binhex/arch-qbittorrent:latest}
    container_name: ${QBIT_CONTAINER_NAME:-qbittorrent}
    network_mode: service:gluetun
    environment:
      TZ: ${TZ:-Etc/UTC}
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "${UMASK:-002}"
      WEBUI_PORT: "8080"
      GLUETUN_INCOMING_PORT: "yes"
      GLUETUN_CONTROL_SERVER_PORT: "8000"
      GLUETUN_CONTROL_SERVER_USERNAME: ${GLUETUN_USER}
      GLUETUN_CONTROL_SERVER_PASSWORD: ${GLUETUN_PASS}
      QBITTORRENT_WEBUI_USER: ${QBIT_USER:-admin}
      QBITTORRENT_WEBUI_PASSWORD: ${QBIT_PASS:?Set QBIT_PASS in .env}
    volumes:
      - ${QBIT_CONFIG_DIR:-./config/qbittorrent}:/config
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    logging: *logging

  gluetun-webui:
    image: ${VPN_UI_IMAGE:-scuzza/gluetun-webui:latest}
    container_name: ${VPN_UI_CONTAINER_NAME:-gluetun-webui}
    ports:
      - "${VPN_UI_BIND_IP:-127.0.0.1}:${VPN_UI_PORT:-3009}:3000"
    environment:
      TZ: ${TZ:-Etc/UTC}
      GLUETUN_CONTROL_URL: http://gluetun:8000
      GLUETUN_USER: ${GLUETUN_USER}
      GLUETUN_PASSWORD: ${GLUETUN_PASS}
      TRUST_PROXY: "${VPN_UI_TRUST_PROXY:-false}"
    networks: [media-vpn]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, -qO-, 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      gluetun:
        condition: service_healthy
    logging: *logging

  qbit_manage:
    image: ${MANAGE_IMAGE:-ghcr.io/stuffanthings/qbit_manage:latest}
    container_name: ${MANAGE_CONTAINER_NAME:-qbit_manage}
    ports:
      - "${MANAGE_BIND_IP:-127.0.0.1}:${MANAGE_PORT:-8185}:8181"
    environment:
      TZ: ${TZ:-Etc/UTC}
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      QBT_WEB_SERVER: "true"
      QBT_PORT: "8181"
      QBT_RUN: "false"
      QBT_SCHEDULE: "${MANAGE_SCHEDULE:-1440}"
      QBT_CONFIG_DIR: /config
      QBT_LOG_LEVEL: ${MANAGE_LOG_LEVEL:-INFO}
      QBT_STARTUP_DELAY: "${MANAGE_STARTUP_DELAY:-30}"
      QBIT_USER: ${QBIT_USER:-admin}
      QBIT_PASS: ${QBIT_PASS}
    volumes:
      - ${MANAGE_CONFIG_DIR:-./config/qbit_manage}:/config
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
      - ${QBIT_CONFIG_DIR:-./config/qbittorrent}:/qbittorrent:ro
    networks: [media-vpn]
    restart: unless-stopped
    depends_on:
      qbittorrent:
        condition: service_started
    logging: *logging

networks:
  media-vpn:
    name: ${NETWORK_NAME:-media-vpn}
    driver: bridge
