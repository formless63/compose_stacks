# Copy to MANAGE_CONFIG_DIR/config.yml once, then edit through the Web UI.
# Keep dry_run enabled until you have reviewed your rules.
commands:
  dry_run: true
  recheck: false
  cat_update: false
  tag_update: false
  rem_unregistered: false
  tag_tracker_error: false
  rem_orphaned: false
  tag_nohardlinks: false
  share_limits: false
qbt:
  host: gluetun:8080
  user: !ENV QBIT_USER
  pass: !ENV QBIT_PASS
settings:
  force_auto_tmm: false
directory:
  root_dir: /downloads
  remote_dir: /downloads
cat: {}
tracker: {}
