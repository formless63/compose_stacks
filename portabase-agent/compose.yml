x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  portabase-agent:
    image: ${AGENT_IMAGE:-portabase/agent:latest}
    restart: always
    logging: *default-logging
    volumes:
      - type: bind
        source: ${AGENT_DIR:-.}/databases.json
        target: /config/config.json
        bind:
          create_host_path: false
    extra_hosts:
    # Use host.docker.internal for services listening on a reachable host address.
      - "host.docker.internal:host-gateway"
    environment:
      TZ: "${TZ:-UTC}"
      # Upstream names this variable POOLING; keep POLLING as our .env setting.
      POOLING: ${POLLING:-5}
      APP_ENV: production
      LOG: info
      EDGE_KEY: "${EDGE_KEY:?Paste the dashboard agent key in .env}"
    networks:
      - service1_net
      - service2_net

networks:
  service1_net:
    external: true
    name: ${DATABASE_NETWORK_1:-service1_net}
  service2_net:
    external: true
    name: ${DATABASE_NETWORK_2:-service2_net}
