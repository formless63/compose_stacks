x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '10m'
    max-file: '3'
    
services:
  # --------------------------------------------------------------------------------
  # Database
  # --------------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    init: true
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supersync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-supersync_db}
    volumes:
      - ${DB_DATA_DIR:-./supersync/db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supersync} -d ${POSTGRES_DB:-supersync_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runs the upstream migrator once before the server starts. Re-run on each upgrade.
  migrate:
    image: ${SUPERSYNC_IMAGE:-ghcr.io/formless63/supersync:latest}
    restart: "no"
    init: true
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "scripts/migrate-deploy.sh"]
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-supersync}:${POSTGRES_PASSWORD:?Set a strong database password in .env}@db:5432/${POSTGRES_DB:-supersync_db}?connection_limit=60&pool_timeout=10
      REQUIRE_DATABASE_POOL_LIMITS: "true"
    logging: *default-logging

  # --------------------------------------------------------------------------------
  # SuperSync Server
  # Host Example: https://sp-sync.domain.com
  # --------------------------------------------------------------------------------
  supersync:
    image: ${SUPERSYNC_IMAGE:-ghcr.io/formless63/supersync:latest}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${SYNC_PORT:-1900}:1900"
    init: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${SUPERSYNC_DATA_DIR:-./supersync/data}:/app/data
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      HOST: 0.0.0.0
      PORT: 1900
      RUN_MIGRATIONS_ON_STARTUP: "false"
      REQUIRE_DATABASE_POOL_LIMITS: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-supersync}:${POSTGRES_PASSWORD:?Set a strong database password in .env}@db:5432/${POSTGRES_DB:-supersync_db}?connection_limit=60&pool_timeout=10
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SUPERSYNC_HIDE_UPSTREAM_NOTICE: "${SUPERSYNC_HIDE_UPSTREAM_NOTICE:-false}"
      CORS_ORIGINS: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in .env}
      PUBLIC_URL: ${SYNC_PUBLIC_URL:?Set SYNC_PUBLIC_URL in .env}
      WEBAUTHN_RP_ID: ${HOSTNAME:?Set HOSTNAME in .env}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Super Productivity Sync}
      WEBAUTHN_ORIGIN: ${SYNC_PUBLIC_URL:?Set SYNC_PUBLIC_URL in .env}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: "${SMTP_FROM:-}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:1900/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --------------------------------------------------------------------------------
  # Super Productivity App
  # Host Example: https://sp.domain.com
  # --------------------------------------------------------------------------------
  app:
    image: johannesjo/super-productivity:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      SYNC_INTERVAL: ${SYNC_INTERVAL:-15}      
      IS_COMPRESSION_ENABLED: ${IS_COMPRESSION_ENABLED:-true}
      IS_ENCRYPTION_ENABLED: ${IS_ENCRYPTION_ENABLED:-false}

