x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-3}"

services:
  directus:
    container_name: ${CONTAINER_NAME:-directus}
    image: directus/directus:${DIRECTUS_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${DIRECTUS_PORT:-8055}:8055"
    depends_on:
      directus-cache:
        condition: service_healthy
    environment:
      # Core
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET:?Set DIRECTUS_SECRET in .env}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:?Set DIRECTUS_PUBLIC_URL in .env}

      # Admin
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?Set the initial administrator password in .env}

      # Database (connects to existing postgres stack)
      DB_CLIENT: ${DB_CLIENT}
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_SCHEMA: ${DB_SCHEMA}

      # Connection pool
      DB_POOL_MIN: ${DB_POOL_MIN:-2} 
      DB_POOL_MAX: ${DB_POOL_MAX:-10}

      # Cache
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      CACHE_AUTO_PURGE: "${CACHE_AUTO_PURGE:-true}"
      CACHE_STORE: redis
      REDIS: redis://directus-cache:6379
      CACHE_SCHEMA: "${CACHE_SCHEMA:-true}"

      # Performance / noise reduction
      TELEMETRY: "${TELEMETRY:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-warn}"

    volumes:
      - ${DIRECTUS_UPLOADS_DIR:-./uploads}:/directus/uploads
      - ${DIRECTUS_EXTENSIONS_DIR:-./extensions}:/directus/extensions

    networks:
      - directus
#      - db_net

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8055/server/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 12
      start_period: 30s

  directus-cache:
    container_name: ${CACHE_CONTAINER_NAME:-directus-cache}
    image: redis:${REDIS_VERSION:-8-alpine}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ${REDIS_DIR:-./redis}:/data
    networks:
      - directus
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  directus:
    name: ${NETWORK_NAME:-directus}
    driver: bridge
#  db_net:   # Uncomment these two lines and adjust to tie to your existing db stack
#    external: true
