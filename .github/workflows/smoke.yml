name: Smoke test compose stacks
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'
permissions:
  contents: read
concurrency:
  group: compose-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        stack: [bitmappery, super-productivity, penpot, directus, portabase, storyteller, readmeabook]
    steps:
      - uses: actions/checkout@v4
      - name: Test disposable stack
        shell: bash
        run: python3 scripts/smoke.py '${{ matrix.stack }}' 2>&1 | tee smoke-result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.stack }}
          path: smoke-result.log
          retention-days: 14
