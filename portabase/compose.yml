x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-3}"

services:
  portabase:
    container_name: ${CONTAINER_NAME:-portabase}
    image: ${PORTABASE_IMAGE:-portabase/portabase:latest}
    restart: always
    logging: *default-logging
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - TZ=${TZ:-America/New_York}
      - TRUSTED_DOMAINS=${PROJECT_URL:?Set PROJECT_URL in .env}
      - PROJECT_NAME=${PROJECT_NAME:?Set PROJECT_NAME in .env}
      - PROJECT_URL=${PROJECT_URL:?Set PROJECT_URL in .env}
      - PROJECT_SECRET=${PROJECT_SECRET:?Set PROJECT_SECRET in .env}
      - POSTGRES_DB=${POSTGRES_DB:?Set POSTGRES_DB in .env}
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_HOST=${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-portabase-pg}:5432/${POSTGRES_DB}?schema=public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "${HOST_PORT}:80"
    volumes:
      - ${DATA_DIR:-./data}:/data
    depends_on:
      portabase-pg:
        condition: service_healthy
    networks:
      - portabase_internal

  portabase-pg:
    container_name: ${DB_CONTAINER_NAME:-portabase-pg}
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: always
    logging: *default-logging
    volumes:
      - ${DB_DIR:-./db}:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portabase_internal

networks:
  portabase_internal:
    name: ${NETWORK_NAME:-portabase_internal}
    driver: bridge
